<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="stylesheet" href="login.css">

<body>
    <form id="form-login">
        <div class="login-image">
            <img src="/frontend/assets/logo.jpg" alt="logo.jpg">
        </div>
        <div class="login-title">
            <h1>Dang nhap</h1>
            <span>Chao mung ban quay lai</span>
        </div>
        <div class="login-email">
            <span>Email</span>
            <input type="email" name="user-email" id="your email">
        </div>
        <div class="login-password">
            <span>Password</span>
            <input type="password" name="user-password" id="yout password">
        </div>
        <div class="password-remember">
            <div class="password-remember__remembered">
                <input type="checkbox" name="remember-password" id="remember-password">
                <span>Ghi nho dang nhap</span>
            </div>
            <div class="password-remember__forgot">
                <a href="">Quen mat khau</a>
            </div>
        </div>
        <div class="dang-nhap">
            <div class="classic">
                <button>Dang nhap</button>
            </div>
            <div class="ozone">
                <hr>
                <span>hoac</span>
            </div>
            <div class="google">
                <button>Tiep tuc voi Google</button>
            </div>
        </div>
        <div class="new-acc">
            <span>Chua co tai khoan?</span>
            <a href="">Dang ky</a>
        </div>
    </form>
</body>


<script src="login.js"></script>
</html>
