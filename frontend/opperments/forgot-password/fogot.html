<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="stylesheet" href="forgot.css">

<body>
    <form id="Forgot-Password">
        <div class="form-forgot">
            <div class="form-forgot-logo">
                <img src="/frontend/assets/logo.jpg" alt="logo.jpg">
            </div>
            <div class="form-forgot-title">
                <h1>Quen mat khau</h1>
                <span>Nhap email de nhap lien ket dat lai mat khau</span>
            </div>
        </div>
        <div class="forgot-email">
            <span>Email</span>
            <input type="email" name="user-email" id="your email">
        </div>
        <div class="forgot-send">
            <div class="classic">
                <button>Dang nhap</button>
            </div>
            <div class="ozone">
                <hr>
                <span>hoac</span>
            </div>
            <div class="go-back">
                <button>Quay lai dang nhap</button>
            </div>
        </div>
        <div class="email-check">
            <span>Vui long kiem tra hop thu den va thu muc Spam neu ban khong nhan duoc email</span>
        </div>
    </form>
</body>
</html>
