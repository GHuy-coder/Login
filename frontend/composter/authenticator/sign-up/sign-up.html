<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<link rel="stylesheet" href="sign-up.css">
<link rel="stylesheet" href="../authenticator.css">

<body>
    <form id="Form">
        <div class="image-form">
            <div class="logo.icon">
                <img src="/frontend/assets/logo.jpg" alt="logo.jpg">
            </div>
            <div class="title">
                <h1>Dang ky</h1>
                <span>Tao tai khoan hoc sinh cua ban</span>
            </div>
        </div>
        <div class="name">
            <span>Ho va ten</span>
            <input type="text" name="user-name" id="your-name">
        </div>
        <div class="email">
            <span>Email</span>
            <input type="email" name="user-email" id="your-email">
        </div>
        <div class="password">
            <span>Mat khau</span>
            <input type="password" name="user-password" id="your-password">
        </div>
        <div class="check-password">
            <span>Mat khau</span>
            <input type="password" name="checked-user-password" id="checked-your-password">
        </div>
        <div class="class">
            <span>Lop</span>
            <select name="class" id="class">
            </select>
        </div>
        <div class="accpect-term">
            <div class="term">
                <input type="checkbox" name="acc-term" id="acc-term">
                <span>Toi dong y voi <a href="">Dieu khoang su dung</a> va <a href="">chinh sach bao mat</a></span>
            </div>
        </div>
        <div class="sign-up">
            <div class="acc-has-been-created">
                <button>Dang nhap</button>
            </div>
            <div class="ozone">
                <hr>
                <span>hoac</span>
            </div>
            <div class="google">
                <button>Tiep tuc voi Google</button>
            </div>
        </div>
        <div class="owned-acc">
            <span>Da ca tai khoan? <a href="../login/login.html">Dang nhap</a></span>
        </div>
    </form>
</body>
</html>
