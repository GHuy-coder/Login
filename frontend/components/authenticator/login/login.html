<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đăng nhập | Blog Học Sinh</title>

    <link rel="stylesheet" href="/frontend/components/authenticator/authenticator.css">
    <link rel="stylesheet" href="login.css">

</head>


<body>

    <main class="login-page">

        <!-- FULL PAGE BACKGROUND -->
        <div class="illustration-area">
            <img
                class="seal-image"
                src="/frontend/assets/cute.jpg"
                alt=""
            >
        </div>


        <!-- =====================================================
            LEFT SIDE
            ===================================================== -->

        <section class="login-introduction">

            <div class="brand">

                <img
                    src="/frontend/assets/logo.png"
                    alt="Blog Học Sinh"
                >

            </div>


            <div class="introduction-content">

                <h1>
                    Bắt đầu

                    <span>
                        hành trình học tập
                    </span>
                </h1>

                <p>
                    Đăng nhập để khám phá kiến thức,
                    viết bài, chia sẻ và phát triển
                    bản thân mỗi ngày.
                </p>

                <p class="study-quote">
                    “Mỗi ngày một chút kiến thức,
                    một bước gần hơn với ước mơ.”
                </p>

            </div>


            <!-- DECORATIONS -->

            <span class="star star-1">✦</span>
            <span class="star star-2">✦</span>
            <span class="star star-3">✦</span>

            <span class="plane">✈</span>

        </section>



        <!-- =====================================================
            RIGHT SIDE
            ===================================================== -->

        <section class="login-side">

            <form class="form" id="login-form">

                <div class="image-form">

                    <img
                        class="form-logo"
                        src="/frontend/assets/logo.png"
                        alt="Blog Học Sinh"
                    >

                    <div class="title">

                        <h1>Đăng nhập</h1>

                        <span>
                            Chào mừng bạn quay lại! ✨
                        </span>

                    </div>

                </div>


                <div class="input-group">

                    <label for="your-email">
                        Email
                    </label>

                    <input
                        type="email"
                        name="user-email"
                        id="your-email"
                        placeholder="Nhập email của bạn"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="your-password">
                        Mật khẩu
                    </label>

                    <input
                        type="password"
                        name="user-password"
                        id="your-password"
                        placeholder="Nhập mật khẩu"
                        required
                    >

                </div>


                <div class="password-remember">

                    <label
                        class="password-remember__remembered"
                        for="remember-password"
                    >

                        <input
                            type="checkbox"
                            name="remember-password"
                            id="remember-password"
                        >

                        <span>
                            Ghi nhớ đăng nhập
                        </span>

                    </label>

                    <a href="../forgot-password/forgot.html">
                        Quên mật khẩu?
                    </a>

                </div>


                <div class="dang-nhap">

                    <div class="classic">

                        <button type="submit">

                            <span>
                                Đăng nhập
                            </span>

                            <strong>
                                →
                            </strong>

                        </button>

                    </div>


                    <div class="ozone">

                        <hr>

                        <span>
                            hoặc
                        </span>

                        <hr>

                    </div>


                    <div class="google">

                        <button type="button">

                            <span class="google-icon">
                                G
                            </span>

                            Tiếp tục với Google

                        </button>

                    </div>

                </div>


                <div class="new-acc">

                    <span>
                        Chưa có tài khoản?
                    </span>

                    <a href="../sign-up/sign-up.html">
                        Đăng ký ngay
                    </a>

                </div>

            </form>

        </section>

    </main>


    <script src="login.js"></script>

</body>

</html>
